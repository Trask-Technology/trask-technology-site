[package]
name = "trask_graph"
version = "0.2.0"
edition = "2021"
description = "Graph generation and WebGL2 rendering for the Trask Technology hero"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
glow = "0.16"

[dependencies.web-sys]
version = "0.3"
features = [
  "HtmlCanvasElement", "Window", "Document", "Performance", "Element", "DomRect",
  "Event", "EventTarget", "MouseEvent", "WheelEvent", "AddEventListenerOptions",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlVertexArrayObject", "WebGlUniformLocation",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
